[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog.html"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/blog.html"
  status = 200
