backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: "https://synnera.com"
display_url: "https://synnera.com"

collections:
  - name: "website"
    label: "Website Content"
    description: "Edit the main Synnera website content, products, contact details and images."
    files:
      - label: "All Website Content"
        name: "site"
        file: "content/site.json"
        format: json
        fields:
          - label: "Brand"
            name: "brand"
            widget: "object"
            fields:
              - {label: "Brand Name", name: "name", widget: "string"}
              - {label: "Legal Company Name", name: "legalName", widget: "string"}
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Founded", name: "founded", widget: "string"}
              - {label: "Logo", name: "logo", widget: "image"}
              - {label: "Primary Color", name: "primaryColor", widget: "color"}
              - {label: "Secondary / Gold Color", name: "secondaryColor", widget: "color"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Phone", name: "phone", widget: "string"}
              - {label: "WhatsApp", name: "whatsapp", widget: "string"}
              - {label: "Address", name: "address", widget: "text"}
              - {label: "Google Maps Link", name: "maps", widget: "string"}
              - {label: "Google Business Profile", name: "googleBusiness", widget: "string", required: false}
              - {label: "Instagram", name: "instagram", widget: "string", required: false}
              - {label: "Facebook", name: "facebook", widget: "string", required: false}
              - {label: "YouTube", name: "youtube", widget: "string", required: false}
              - {label: "Twitter / X", name: "twitter", widget: "string", required: false}

          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - {label: "Page Title", name: "title", widget: "string"}
              - {label: "Meta Description", name: "description", widget: "text"}

          - label: "Home"
            name: "home"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Headline", name: "headline", widget: "string"}
              - {label: "Subheadline", name: "subheadline", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - {label: "Primary Button", name: "ctaPrimary", widget: "string"}
              - {label: "Secondary Button", name: "ctaSecondary", widget: "string"}
              - {label: "Hero Image", name: "heroImage", widget: "image"}

          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - label: "Statistics"
                name: "stats"
                widget: "list"
                fields:
                  - {label: "Value", name: "value", widget: "string"}
                  - {label: "Label", name: "label", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}

          - label: "Products Introduction"
            name: "productsIntro"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}

          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - {label: "Product Name", name: "title", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - label: "Features"
                name: "features"
                widget: "list"
                field: {label: "Feature", name: "feature", widget: "string"}
              - {label: "Product Image", name: "image", widget: "image"}

          - label: "Manufacturing"
            name: "manufacturing"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - label: "Process Steps"
                name: "steps"
                widget: "list"
                fields:
                  - {label: "Number", name: "number", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Text", name: "text", widget: "text"}
              - {label: "Factory Image", name: "image", widget: "image"}

          - label: "B2B Capabilities"
            name: "capabilities"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - label: "Capabilities"
                name: "items"
                widget: "list"
                field: {label: "Capability", name: "capability", widget: "string"}

          - label: "Why Synnera"
            name: "why"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Reasons"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Text", name: "text", widget: "text"}

          - label: "Hotel Introduction"
            name: "hotelIntro"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}

          - label: "Hotel Content"
            name: "hotelContent"
            widget: "object"
            fields:
              - {label: "Description", name: "description", widget: "text"}
              - label: "Applications"
                name: "applications"
                widget: "list"
                field: {label: "Application", name: "application", widget: "string"}
              - {label: "Enquire Text", name: "enquireText", widget: "text"}

          - label: "Hotel FAQ"
            name: "hotelFaq"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "FAQ Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Question", name: "question", widget: "string"}
                  - {label: "Answer", name: "answer", widget: "text"}

          - label: "Home Page FAQ"
            name: "faq"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "FAQ Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Question", name: "question", widget: "string"}
                  - {label: "Answer", name: "answer", widget: "text"}

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - {label: "Form Title", name: "formTitle", widget: "string"}
              - {label: "Success Message", name: "successMessage", widget: "string"}
              - {label: "Recipient Email", name: "recipientEmail", widget: "string"}

          - label: "Gallery"
            name: "gallery"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Page Title (H1)", name: "title", widget: "string"}
              - {label: "Intro", name: "body", widget: "text"}
              - {label: "Videos Heading", name: "videosTitle", widget: "string"}
              - {label: "Videos Intro", name: "videosIntro", widget: "text"}
              - {label: "Photos Heading", name: "photosTitle", widget: "string"}
              - {label: "Photos Intro", name: "photosIntro", widget: "text"}
              - {label: "Call-to-action Title", name: "ctaTitle", widget: "string"}
              - {label: "Call-to-action Text", name: "ctaBody", widget: "text"}
              - label: "YouTube Videos"
                name: "videos"
                widget: "list"
                fields:
                  - {label: "YouTube Video ID", name: "youtubeId", widget: "string", hint: "The 11 characters after v= in the video link, e.g. k_AG9hA6lsQ"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text", hint: "2-3 sentences describing what the video shows"}
                  - {label: "Upload Date", name: "uploadDate", widget: "string", hint: "YYYY-MM-DD"}
              - label: "Factory Photos"
                name: "photos"
                widget: "list"
                required: false
                fields:
                  - {label: "Photo", name: "image", widget: "image"}
                  - {label: "Alt Text", name: "alt", widget: "string", hint: "Describe the photo, e.g. Workers assembling pocket spring mattresses at the Synnera factory in Rajkot"}
                  - {label: "Caption", name: "caption", widget: "string", required: false}
                  - {label: "Category", name: "category", widget: "string", required: false}

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Copyright", name: "copyright", widget: "string"}
              - {label: "Footer Note", name: "note", widget: "string"}
              - label: "Social Links"
                name: "socialLinks"
                widget: "list"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
                  - {label: "Icon", name: "icon", widget: "string", hint: "maps, youtube, facebook, instagram, whatsapp, x"}

  - name: "blog"
    label: "Blog Posts"
    description: "Manage blog articles, guides, and expert content about mattresses and sleep."
    folder: "content/blog"
    create: true
    format: json
    extension: json
    identifier_field: "slug"
    slug: "{{slug}}"
    fields:
      - {label: "Slug", name: "slug", widget: "string", hint: "URL-friendly unique identifier (e.g. best-mattress-for-back-pain-relief)"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text", hint: "Short summary for blog listing and SEO meta"}
      - {label: "Date", name: "date", widget: "date", hint: "Publication date (YYYY-MM-DD)"}
      - {label: "Author", name: "author", widget: "string", default: "Synnera Mattress LLP"}
      - {label: "Category", name: "category", widget: "string", hint: "e.g. Orthopedic Mattresses, Sleep Tips, Product Guide"}
      - {label: "Read Time", name: "readTime", widget: "string", hint: "e.g. 12 min read"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Content", name: "content", widget: "markdown", hint: "Full article content with HTML/Markdown"}
